<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيانات النقل</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      direction: rtl;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #054239;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: #054239;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .result {
      margin-top: 22px;
      background: #f7f7f7;
      border-radius: 14px;
      padding: 16px;
      line-height: 2;
      border-right: 5px solid #054239;
    }

    .result-title {
      font-weight: bold;
      color: #054239;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .error {
      margin-top: 18px;
      padding: 12px;
      background: #fdecec;
      color: #a10000;
      border-radius: 10px;
      text-align: center;
    }

    .call-btn {
      display: block;
      text-align: center;
      margin-top: 14px;
      padding: 12px;
      background: #0b6b5d;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="page">
  <div class="card">
    <h2>بيانات النقل</h2>
    <div class="subtitle">أدخل رقم الموظف وكود التحقق لمعرفة بيانات السائق</div>

    <label for="employee_id">رقم الموظف</label>
    <input type="text" id="employee_id" placeholder="مثال: H001">

    <label for="verification_code">كود التحقق</label>
    <input type="text" id="verification_code" placeholder="مثال: 7845">

    <button id="searchBtn" onclick="searchEmployee()">بحث</button>

    <div id="output"></div>

    <div class="footer">
      يرجى عدم مشاركة كود التحقق مع الآخرين
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzsE_IwrIBF85ULiBSKYGdVxiH8St7W-mqGiv363w0dhbHDQqbYLSOULk5PdvfIvDoGzw/exec";

async function searchEmployee() {
  const employeeId = document.getElementById("employee_id").value.trim();
  const verificationCode = document.getElementById("verification_code").value.trim();
  const output = document.getElementById("output");
  const searchBtn = document.getElementById("searchBtn");

  output.innerHTML = "";

  if (!employeeId || !verificationCode) {
    output.innerHTML = `<div class="error">يرجى إدخال البيانات المطلوبة.</div>`;
    return;
  }

  searchBtn.disabled = true;
  searchBtn.innerText = "جاري البحث...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        employee_id: employeeId,
        verification_code: verificationCode
      })
    });

    const data = await response.json();

    if (!data.success) {
      output.innerHTML = `<div class="error">بيانات الدخول غير صحيحة.</div>`;
      return;
    }

    const phone = data.driver_phone || "";

    output.innerHTML = `
      <div class="result">
        <div class="result-title">معلومات النقل</div>
        <strong>اسم الموظف:</strong> ${data.employee_name || "-"}<br>
        <strong>اسم السائق:</strong> ${data.driver_name || "-"}<br>
        <strong>رقم هاتف السائق:</strong> ${phone || "-"}<br>
        <strong>رقم السيارة:</strong> ${data.vehicle_number || "-"}<br>
        <strong>نقطة التجمع:</strong> ${data.pickup_location || "-"}<br>
        <strong>تاريخ الرحلة:</strong> ${data.trip_date || "-"}<br>
        <strong>ملاحظات:</strong> ${data.notes || "-"}<br>

        ${phone ? `<a class="call-btn" href="https://wa.me/${formatWhatsAppNumber(phone)}" target="_blank">
  مراسلة السائق عبر واتساب
</a>` : ""}
      </div>
    `;

  } catch (error) {
    output.innerHTML = `<div class="error">تعذر الاتصال بالخدمة. حاول لاحقًا.</div>`;
  } finally {
    searchBtn.disabled = false;
    searchBtn.innerText = "بحث";
  }
}
</script>

</body>
</html>
